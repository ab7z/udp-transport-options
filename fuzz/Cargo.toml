[package]
name = "udp-transport-options-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
udp-transport-options = { path = ".." }

[[bin]]
name = "wire_datagram"
path = "fuzz_targets/wire_datagram.rs"
test = false
doc = false
bench = false

[[bin]]
name = "options_tlv"
path = "fuzz_targets/options_tlv.rs"
test = false
doc = false
bench = false

[[bin]]
name = "options_serialize"
path = "fuzz_targets/options_serialize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "options_ocs"
path = "fuzz_targets/options_ocs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "options_typed"
path = "fuzz_targets/options_typed.rs"
test = false
doc = false
bench = false

[[bin]]
name = "socket_assemble"
path = "fuzz_targets/socket_assemble.rs"
test = false
doc = false
bench = false

[[bin]]
name = "process_datagram"
path = "fuzz_targets/process_datagram.rs"
test = false
doc = false
bench = false

# Standalone workspace root: keeps the nightly-only fuzz build out of the parent crate.
[workspace]
