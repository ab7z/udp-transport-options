# Cross-compile targets for the Linux test hosts (see scripts/vm-ubuntu-server.sh).
# rust-lld links the self-contained musl targets, so no host GCC cross toolchain is needed;
# the runner ships every built binary to the configured host over SSH and executes it there.
[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
runner = ["scripts/achim-runner.sh"]

[target.x86_64-unknown-linux-musl]
linker = "rust-lld"
runner = ["scripts/achim-runner.sh"]
