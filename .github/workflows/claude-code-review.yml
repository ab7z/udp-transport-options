name: Agent PR Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: agent-pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust ${{ matrix.check }}
    runs-on: ubuntu-latest
    if: github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref != 'main'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: format
            command: cargo fmt --check
          - check: lint
            command: cargo clippy --all-targets -- -D warnings -D clippy::all -D clippy::correctness -D clippy::suspicious -D clippy::complexity -D clippy::perf -D clippy::style
          - check: test
            command: cargo test --all-targets

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          persist-credentials: false

      - name: Show Rust toolchain
        run: rustup show

      - name: Fetch Cargo dependencies
        run: cargo fetch --locked

      - name: Run ${{ matrix.check }}
        run: ${{ matrix.command }}

  lean:
    name: Lean verification
    runs-on: ubuntu-latest
    if: github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref != 'main'
    needs: rust
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          persist-credentials: false

      - name: Cache elan and Lake build
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            formal/lean-rfc9868/.lake
          key: lean-${{ runner.os }}-${{ hashFiles('formal/lean-rfc9868/lean-toolchain') }}

      - name: Install elan (pinned toolchain only)
        env:
          # Commit-pinned elan-init.sh (immutable URL), not the floating master branch.
          ELAN_INIT_URL: https://raw.githubusercontent.com/leanprover/elan/b6cec7e10fe4965a605aaf60d1cb4a5837f0462b/elan-init.sh
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSfL "$ELAN_INIT_URL" | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build specs and audit axioms
        run: scripts/lean-gate.sh

  agent-reviews:
    name: Request agent reviews
    runs-on: ubuntu-latest
    if: github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref != 'main'
    needs: [rust, lean]
    permissions:
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      - name: Post review request comment
        env:
          # The @claude mention only triggers claude.yml when posted with a user
          # PAT: GitHub never fires workflow events for workflow-token comments.
          GH_TOKEN: ${{ secrets.AGENT_TRIGGER_PAT || github.token }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file - <<'EOF'
          @claude Review this pull request focusing on code best practices, code security,
          and safety. RFC 9868 semantic and protocol conformance is reviewed separately by
          Codex; raise such points only when they are security- or safety-relevant.
          Keep your reply minimal: the task checklist plus at most one short sentence per
          genuine finding. If there are no findings, reply with just "Ok".

          @codex review for RFC 9868 semantic and protocol conformance: wire format, option
          framing and handling, OCS, FRAG, and receive-pipeline semantics of the changes.
          Code style, best practices, and security are covered by a separate check; skip them.
          EOF
